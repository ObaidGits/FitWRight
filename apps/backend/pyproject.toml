[project]
name = "fitwright-backend"
version = "2.0.0"
description = "FitWright Backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.128.4",
    "uvicorn==0.40.0",
    "python-multipart==0.0.31",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "tinydb==4.8.2",
    "sqlalchemy[asyncio]==2.0.36",
    "aiosqlite==0.20.0",
    # Postgres drivers for the hosted target (ADR-13): asyncpg powers the async
    # document engine; psycopg v3 powers the sync engine on the encrypted
    # api_keys hot path. SQLite (aiosqlite) remains the local zero-config default.
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.9",
    "cryptography==48.0.1",
    "litellm==1.86.2",
    "markitdown[docx]==0.1.4",
    "pdfminer.six==20260107",
    "playwright==1.58.0",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "authlib>=1.7.2",
    "itsdangerous>=2.2.0",
    "redis>=8.0.1",
    "pillow==11.3.0",
    # Explicit runtime dependency: the Razorpay order call uses it. It was already
    # present transitively via litellm, but a payment path must not rest on another
    # package's dependency choices.
    "httpx>=0.28.0",
]

[project.scripts]
app = "app.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.28.0",
    "respx>=0.21.1",
]
e2e-monitor = [
    "pypdf>=4.0.0",  # PDF text probe for the non-blank render check
    "httpx>=0.28.0",
]
# Optional OCR for scanned/image-only PDFs (§20). Enabled at runtime via
# JD_OCR_ENABLED=true. Requires the system `tesseract-ocr` + `poppler-utils`
# binaries (add to the Docker image). Native-text PDF extraction works WITHOUT
# this group via the always-present pdfminer.six dependency.
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
]
# Optional job-discovery feature (§10.5, 3.1, 4.2). Gated behind the
# JOB_DISCOVERY kill-switch; the base app imports and boots WITHOUT this group
# installed (connectors lazy-import their scraper deps). Install with:
#   uv sync --extra job-discovery   (or  pip install '.[job-discovery]')
# Pinned so scraper/browser behavior is reproducible across environments.
job-discovery = [
    "python-jobspy==1.1.82",  # fixed-board scraping (Indeed/Naukri/LinkedIn)
    "crawl4ai==0.9.2",        # LLM-guided extraction for custom site recipes
    "patchright==1.61.2",     # patched Playwright driver for the stealth fetch lane
    "camoufox==0.5.4",        # optional hardened Firefox fetcher for the stealth lane
    "curl-cffi>=0.7.0",      # TLS fingerprint impersonation (bypasses Akamai)
    "nodriver>=0.38",         # undetected Chrome for Cloudflare bypass
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "-v",
    # Safety net: no single test may hang the suite/CI. A stuck test fails after
    # 120s (signal method interrupts blocked I/O) instead of blocking forever.
    "--timeout=120",
    # Exclude LLM-as-judge evals from the default run (they may call a real
    # provider and are non-deterministic). Run them on demand with `-m eval`.
    "-m",
    "not eval",
]
markers = [
    "unit: pure function tests, no external dependencies",
    "service: service layer tests with mocked LLM",
    "integration: API endpoint tests with httpx AsyncClient",
    "eval: prompt-quality evaluations; may call a real LLM, skipped without a configured key",
]

[tool.uv]
# python-jobspy's wheel metadata hard-pins `numpy==1.26.3`, which is
# incompatible with the base app's markitdown -> magika requirement of
# `numpy>=2.1.0`. jobspy only touches numpy transitively via pandas and runs
# fine on numpy 2.x, so we relax that over-strict pin here.
override-dependencies = ["numpy>=2.1.0,<3"]


[tool.ruff]
line-length = 100
target-version = "py313"
# Generated migration bodies follow alembic's own style.
exclude = ["alembic/versions"]

[tool.ruff.lint]
# Deliberately a SMALL rule set: the mistakes that survive a green test suite, not a
# style guide. The backend had no linter at all, and within one session that cost a
# dead import shipped past 3,400 passing tests plus TWO undefined names that would
# have raised at runtime (an unimported model in a new query, and an unimported job in
# the scheduler) - neither caught by any test, both caught by this on first run.
#
# Import sorting (I) and syntax modernisation (UP) are NOT enabled. They report ~400
# findings across pre-existing code, and a linter whose first run demands a
# whole-codebase reformat gets switched off - after which it catches nothing.
select = [
    "F",    # pyflakes: undefined names, unused imports, unused locals, f-string bugs
    "E9",   # syntax and IO errors
    "B",    # bugbear: mutable default args, except-without-raise, zip-without-strict
]
ignore = [
    # `Depends(...)` in a parameter default is THE FastAPI idiom. Flagging it would
    # mean disabling the rule per-line across every router in the project.
    "B008",
    # `raise X` inside `except` without `from`. Worth doing, but it is 65 call sites
    # of pre-existing code and unrelated to correctness here.
    "B904",
    # Long lines are almost all explanatory comments, which is where they earn their
    # keep.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests import inside functions to pick up monkeypatched modules, and assert on
# deliberately odd shapes.
# Tests: unused locals are often "assert this call succeeded", blind-exception asserts
# predate this linter, and unused loop vars appear in shape-only iterations. None of
# these are correctness risks in test code, and fixing 27 of them would be churn.
"tests/**" = ["B011", "F811", "F841", "B017", "B007", "F402"]
# Router modules re-export names for the package's public surface.
"app/routers/__init__.py" = ["F401"]
