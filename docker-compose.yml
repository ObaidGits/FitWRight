services:
  fitwright:
    image: fitwright:local
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: /
        NEXT_PUBLIC_SINGLE_USER_MODE: "true"
        NEXT_PUBLIC_SITE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - resume-data:/app/backend/data
    extra_hosts:
      # Lets Linux containers reach Ollama/LM Studio running on the host.
      - "host.docker.internal:host-gateway"
    environment:
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      SINGLE_USER_MODE: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_LLM: ${LOG_LLM:-WARNING}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  resume-data:
    driver: local
