services:
  fitwright:
    image: fitwright:local
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: /
        NEXT_PUBLIC_SINGLE_USER_MODE: "true"
        NEXT_PUBLIC_SITE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - resume-data:/app/backend/data
    extra_hosts:
      # Lets Linux containers reach Ollama/LM Studio running on the host.
      - "host.docker.internal:host-gateway"
    environment:
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      SINGLE_USER_MODE: "true"
      # The secret that encrypts stored API keys.
      #
      # Must be passed through, or the container falls back to generating its own
      # in the data volume - and a key saved while running natively (or under a
      # previous volume) then decrypts to nothing and looks deleted. Blank is
      # allowed: the app generates and persists one in the volume, which is fine
      # as long as the volume survives. `docker compose down -v` destroys it and
      # every stored key with it.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_LLM: ${LOG_LLM:-WARNING}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      JOB_DISCOVERY: "true"
      CF_BYPASS_URL: "http://cf-bypass:8000"
      # MCP (Model Context Protocol) server. Off unless explicitly enabled -
      # the same kill-switch the backend reads (see docs/mcp.md).
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_TOKEN_TTL_DAYS: ${MCP_TOKEN_TTL_DAYS:-0}
      MCP_MAX_TOKENS_PER_USER: ${MCP_MAX_TOKENS_PER_USER:-10}
    depends_on:
      - cf-bypass
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  cf-bypass:
    image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
    restart: unless-stopped
    # Internal only — not exposed to host. Used by the app for Akamai/CF-protected sites.
    expose:
      - "8000"

volumes:
  resume-data:
    driver: local
